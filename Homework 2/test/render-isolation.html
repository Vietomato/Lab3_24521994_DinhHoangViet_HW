<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Piano render isolation fixture</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { Profiler, StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import App from '/src/App.jsx';
      import '/src/styles/piano.css';
      window.pianoCommits = [];
      const tree = React.createElement(Profiler, {
        id: 'piano',
        onRender: (id, phase, actualDuration) => pianoCommits.push({ id, phase, actualDuration }),
      }, React.createElement(App));
      const strict = new URLSearchParams(location.search).get('strict') !== 'false';
      createRoot(document.getElementById('root')).render(strict ? React.createElement(StrictMode, null, tree) : tree);
    </script>
  </body>
</html>
